<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Patterns — Stock Technical Analysis</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .container { max-width: 1300px; margin: 0 auto; padding: 2rem 1.5rem; }
  .header { margin-bottom: 1.5rem; }
  .header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.3rem; }
  .header h1 span { color: #58a6ff; }
  .header .sub { color: #8b949e; font-size: 0.9rem; }
  .nav-links { display: flex; gap: 1rem; margin-bottom: 1rem; font-size: 0.85rem; }

  .tab-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .tab-bar button {
    flex: 1; padding: 0.7rem 1rem; font-size: 0.9rem; font-weight: 600; border: 2px solid transparent;
    border-radius: 8px; cursor: pointer; transition: all 0.15s; background: #161b22; color: #8b949e;
  }
  .tab-bar button:hover { color: #e1e4e8; border-color: #30363d; }
  .tab-bar button.active { color: #fff; }
  .tab-hourly.active { background: #8b5cf6; border-color: #8b5cf6; }
  .tab-daily.active { background: #1f6feb; border-color: #1f6feb; }
  .tab-weekly.active { background: #238636; border-color: #238636; }

  .summary-bar { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .summary-chip {
    padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600;
    background: #161b22; border: 1px solid #30363d; color: #8b949e;
  }
  .summary-chip .count { color: #e1e4e8; font-size: 1rem; margin-right: 0.3rem; }

  .meta-bar { display: flex; justify-content: space-between; margin-bottom: 1rem; color: #8b949e; font-size: 0.82rem; }
  .spinner { display: none; text-align: center; padding: 3rem; color: #8b949e; }
  .spinner.active { display: block; }
  .error-msg { text-align: center; padding: 2rem; color: #f85149; display: none; }

  .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filter-btn {
    padding: 0.35rem 0.7rem; border-radius: 5px; font-size: 0.78rem; font-weight: 600;
    border: 1px solid #30363d; background: #161b22; color: #8b949e; cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { border-color: #58a6ff; color: #e1e4e8; }
  .filter-btn.active { background: #58a6ff20; color: #58a6ff; border-color: #58a6ff; }

  .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1rem; }
  .stock-card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 1rem 1.15rem;
    transition: border-color 0.15s;
  }
  .stock-card:hover { border-color: #58a6ff; }
  .stock-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
  .stock-sym { font-size: 1.05rem; font-weight: 700; }
  .stock-sym a { color: #e1e4e8; }
  .stock-sym a:hover { color: #58a6ff; }
  .stock-name { font-size: 0.75rem; color: #8b949e; }
  .stock-cmp { font-size: 0.85rem; color: #8b949e; }
  .stock-cmp strong { color: #e1e4e8; }

  .pattern-list { margin-top: 0.5rem; }
  .pattern-item {
    display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.6rem;
    background: #0d1117; border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.84rem;
  }
  .pattern-name { font-weight: 600; }
  .pattern-bias {
    font-size: 0.72rem; font-weight: 700; padding: 0.15rem 0.45rem; border-radius: 4px;
    text-transform: uppercase;
  }
  .bias-bullish { background: #3fb95015; color: #3fb950; border: 1px solid #3fb95040; }
  .bias-bearish { background: #f8514915; color: #f85149; border: 1px solid #f8514940; }
  .bias-neutral { background: #8b949e15; color: #8b949e; border: 1px solid #8b949e40; }
  .pattern-note { font-size: 0.75rem; color: #8b949e; margin-top: 0.2rem; }
  .pattern-target { font-size: 0.78rem; color: #a3d977; margin-top: 0.15rem; }

  .ema-info { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; }
  .ema-tag { font-size: 0.7rem; padding: 0.12rem 0.4rem; border-radius: 4px; font-weight: 600; }

  .empty-state { text-align: center; padding: 3rem; color: #8b949e; }

  @media (max-width: 720px) {
    .results-grid { grid-template-columns: 1fr; }
    .tab-bar { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="nav-links">
    <a href="/">&larr; Analysis</a>
    <a href="/scanner">Scanner</a>
  </div>
  <div class="header">
    <h1>Chart <span>Patterns</span></h1>
    <div class="sub">F&O stocks with active chart pattern formations across multiple timeframes</div>
  </div>

  <div class="tab-bar">
    <button class="tab-hourly" onclick="loadPatterns('hourly')">1H Candles</button>
    <button class="tab-daily active" onclick="loadPatterns('daily')">1D Candles</button>
    <button class="tab-weekly" onclick="loadPatterns('weekly')">1W Candles</button>
  </div>

  <div id="summaryBar" class="summary-bar" style="display:none;"></div>
  <div id="filterRow" class="filter-row" style="display:none;"></div>
  <div class="meta-bar" id="metaBar" style="display:none;">
    <span id="metaInfo"></span>
  </div>

  <div class="spinner" id="spinner">Scanning F&O stocks for chart patterns&hellip;</div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="results-grid" id="resultsGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <p>No chart patterns detected on this timeframe.</p>
  </div>
</div>

<script>
const cache = {};
let currentTf = 'daily';
let currentFilter = 'all';
let currentData = null;

function fmt(v) { return v != null ? Number(v).toLocaleString('en-IN', {maximumFractionDigits: 2}) : '—'; }

function setTab(tf) {
  currentTf = tf;
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  const cls = tf === 'hourly' ? 'tab-hourly' : tf === 'weekly' ? 'tab-weekly' : 'tab-daily';
  document.querySelector(`.${cls}`).classList.add('active');
}

async function loadPatterns(tf) {
  setTab(tf);
  const grid = document.getElementById('resultsGrid');
  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('errorMsg');
  const emptyState = document.getElementById('emptyState');

  grid.innerHTML = '';
  errorMsg.style.display = 'none';
  emptyState.style.display = 'none';
  document.getElementById('summaryBar').style.display = 'none';
  document.getElementById('filterRow').style.display = 'none';
  document.getElementById('metaBar').style.display = 'none';

  if (cache[tf]) { currentData = cache[tf]; renderResults(cache[tf]); return; }

  spinner.classList.add('active');
  try {
    const res = await fetch(`/patterns/scan?timeframe=${tf}`);
    const data = await res.json();
    if (data.error) { errorMsg.textContent = data.error; errorMsg.style.display = 'block'; return; }
    cache[tf] = data;
    currentData = data;
    renderResults(data);
  } catch (err) {
    errorMsg.textContent = 'Network error: ' + err.message;
    errorMsg.style.display = 'block';
  } finally {
    spinner.classList.remove('active');
  }
}

function renderResults(data) {
  const summaryBar = document.getElementById('summaryBar');
  const filterRow = document.getElementById('filterRow');
  const metaBar = document.getElementById('metaBar');
  const emptyState = document.getElementById('emptyState');

  document.getElementById('metaInfo').textContent = `${data.stocks_with_patterns} of ${data.total_scanned} F&O stocks have patterns`;
  metaBar.style.display = 'flex';

  // Summary chips
  const ps = data.pattern_summary || {};
  const sortedPatterns = Object.entries(ps).sort((a, b) => b[1].count - a[1].count);
  summaryBar.innerHTML = sortedPatterns.map(([name, s]) =>
    `<div class="summary-chip"><span class="count">${s.count}</span>${name}</div>`
  ).join('');
  summaryBar.style.display = 'flex';

  // Filter buttons
  currentFilter = 'all';
  let filters = '<span class="filter-btn active" onclick="applyFilter(\'all\', this)">All</span>';
  filters += '<span class="filter-btn" onclick="applyFilter(\'verdict_buy\', this)" style="border-color:#3fb95040;">BUY Calls</span>';
  filters += '<span class="filter-btn" onclick="applyFilter(\'verdict_sell\', this)" style="border-color:#f8514940;">SELL Calls</span>';
  filters += '<span class="filter-btn" onclick="applyFilter(\'bullish\', this)">Bullish Patterns</span>';
  filters += '<span class="filter-btn" onclick="applyFilter(\'bearish\', this)">Bearish Patterns</span>';
  sortedPatterns.forEach(([name]) => {
    filters += `<span class="filter-btn" onclick="applyFilter('${name}', this)">${name}</span>`;
  });
  filterRow.innerHTML = filters;
  filterRow.style.display = 'flex';

  renderCards(data.results);
}

function applyFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (currentData) renderCards(currentData.results);
}

function renderCards(results) {
  const grid = document.getElementById('resultsGrid');
  const emptyState = document.getElementById('emptyState');

  let filtered = results;
  if (currentFilter === 'verdict_buy') {
    filtered = results.filter(r => r.verdict === 'BUY');
  } else if (currentFilter === 'verdict_sell') {
    filtered = results.filter(r => r.verdict === 'SELL');
  } else if (currentFilter === 'bullish') {
    filtered = results.filter(r => r.patterns.some(p => p.bias === 'bullish'));
  } else if (currentFilter === 'bearish') {
    filtered = results.filter(r => r.patterns.some(p => p.bias === 'bearish'));
  } else if (currentFilter !== 'all') {
    filtered = results.filter(r => r.patterns.some(p => p.name === currentFilter));
  }

  if (!filtered.length) { grid.innerHTML = ''; emptyState.style.display = 'block'; return; }
  emptyState.style.display = 'none';

  grid.innerHTML = filtered.map(r => {
    const sym = (r.display_symbol || r.symbol || '').replace('NSE:', '').replace('-EQ', '');
    const emaColor = r.ema_alignment === 'strong_bullish' ? '#3fb950' : r.ema_alignment === 'bullish' ? '#a3d977' : r.ema_alignment === 'bearish' ? '#f0883e' : r.ema_alignment === 'strong_bearish' ? '#f85149' : '#8b949e';

    let emaTags = `<span class="ema-tag" style="background:${emaColor}15;color:${emaColor};border:1px solid ${emaColor}40;">EMA: ${(r.ema_alignment || 'neutral').replace('_', ' ')}</span>`;
    if (r.ema_crossovers) r.ema_crossovers.forEach(c => {
      emaTags += `<span class="ema-tag" style="background:#3fb95015;color:#3fb950;border:1px solid #3fb95040;">${c}</span>`;
    });

    const patternsHtml = r.patterns.map(p => {
      const biasCls = p.bias === 'bullish' ? 'bias-bullish' : p.bias === 'bearish' ? 'bias-bearish' : 'bias-neutral';
      let levels = '';
      if (p.breakout_level_up) {
        levels += `<div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:0.3rem;font-size:0.78rem;">`;
        levels += `<span style="color:#3fb950;">Buy above ₹${fmt(p.breakout_level_up)}</span>`;
        if (p.breakout_target_up) levels += `<span style="color:#a3d977;">Target ₹${fmt(p.breakout_target_up)}</span>`;
        if (p.sl_up) levels += `<span style="color:#f85149;">SL ₹${fmt(p.sl_up)}</span>`;
        levels += `</div>`;
      }
      if (p.breakout_level_down) {
        levels += `<div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:0.3rem;font-size:0.78rem;">`;
        levels += `<span style="color:#f85149;">Sell below ₹${fmt(p.breakout_level_down)}</span>`;
        if (p.breakout_target_down) levels += `<span style="color:#f0883e;">Target ₹${fmt(p.breakout_target_down)}</span>`;
        if (p.sl_down) levels += `<span style="color:#f85149;">SL ₹${fmt(p.sl_down)}</span>`;
        levels += `</div>`;
      }
      if (!p.breakout_level_up && p.breakout_target_up) {
        levels += `<div style="font-size:0.78rem;margin-top:0.3rem;color:#a3d977;">&#9650; Target: ₹${fmt(p.breakout_target_up)}</div>`;
      }
      if (!p.breakout_level_down && p.breakout_target_down) {
        levels += `<div style="font-size:0.78rem;margin-top:0.3rem;color:#f0883e;">&#9660; Target: ₹${fmt(p.breakout_target_down)}</div>`;
      }
      return `<div class="pattern-item">
        <div style="flex:1;">
          <div class="pattern-name">${p.name}</div>
          <div class="pattern-note">${p.note || ''}</div>
          ${levels}
        </div>
        <span class="pattern-bias ${biasCls}">${p.bias}</span>
      </div>`;
    }).join('');

    const vColor = r.verdict === 'BUY' ? '#3fb950' : r.verdict === 'SELL' ? '#f85149' : '#8b949e';
    const vBorder = r.verdict === 'BUY' ? '#3fb95050' : r.verdict === 'SELL' ? '#f8514950' : '#30363d';
    const confColor = r.confidence === 'High' ? '#3fb950' : r.confidence === 'Medium' ? '#d29922' : '#8b949e';

    return `<div class="stock-card" style="border-color:${vBorder};">
      <div class="stock-header">
        <div>
          <div class="stock-sym"><a href="/?symbol=${encodeURIComponent(sym)}">${sym}</a> <span style="font-size:0.85rem;font-weight:800;color:${vColor};margin-left:0.3rem;">${r.verdict || ''}</span></div>
          <div class="stock-name">${r.name || ''}</div>
        </div>
        <div style="text-align:right;">
          <div class="stock-cmp">₹<strong>${fmt(r.cmp)}</strong></div>
          <div style="font-size:0.7rem;color:${confColor};font-weight:600;">${r.confidence || ''} Confidence</div>
          ${r.rsi ? `<div style="font-size:0.7rem;color:#8b949e;">RSI: ${r.rsi}</div>` : ''}
        </div>
      </div>
      ${r.reasons && r.reasons.length ? `<div style="margin:0.4rem 0;">${r.reasons.map(reason => `<div style="font-size:0.78rem;color:#c9d1d9;padding:0.1rem 0;"><span style="color:${vColor};margin-right:0.3rem;">&#10003;</span>${reason}</div>`).join('')}</div>` : ''}
      <div class="ema-info">${emaTags}</div>
      <div class="pattern-list">${patternsHtml}</div>
    </div>`;
  }).join('');
}

loadPatterns('daily');
</script>
</body>
</html>
