<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Picks Scanner — Stock Technical Analysis</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.3rem; }
  .header h1 span { color: #58a6ff; }
  .header .sub { color: #8b949e; font-size: 0.9rem; }
  .back-link { display: inline-block; margin-bottom: 1rem; font-size: 0.85rem; color: #8b949e; }
  .back-link:hover { color: #e1e4e8; }

  .tab-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .tab-bar button {
    flex: 1; padding: 0.7rem 1rem; font-size: 0.9rem; font-weight: 600; border: 2px solid transparent;
    border-radius: 8px; cursor: pointer; transition: all 0.15s; background: #161b22; color: #8b949e;
  }
  .tab-bar button:hover { color: #e1e4e8; border-color: #30363d; }
  .tab-bar button.active { color: #fff; }
  .tab-bar .tab-intra.active { background: #8b5cf6; border-color: #8b5cf6; }
  .tab-bar .tab-short.active { background: #1f6feb; border-color: #1f6feb; }
  .tab-bar .tab-pos.active { background: #238636; border-color: #238636; }

  .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; color: #8b949e; font-size: 0.82rem; }

  .spinner { display: none; text-align: center; padding: 3rem; color: #8b949e; font-size: 1rem; }
  .spinner.active { display: block; }
  .error-msg { text-align: center; padding: 2rem; color: #f85149; font-size: 0.95rem; display: none; }

  .picks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }

  .pick-card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 1.1rem 1.25rem;
    transition: border-color 0.15s;
  }
  .pick-card:hover { border-color: #58a6ff; }

  .pick-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
  .pick-symbol { font-size: 1.1rem; font-weight: 700; }
  .pick-symbol a { color: #e1e4e8; }
  .pick-symbol a:hover { color: #58a6ff; }
  .pick-name { font-size: 0.78rem; color: #8b949e; margin-top: 0.1rem; }
  .pick-conviction {
    padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700;
    text-align: center; min-width: 80px;
  }

  .pick-cmp { font-size: 0.85rem; color: #8b949e; margin-bottom: 0.6rem; }
  .pick-cmp strong { color: #e1e4e8; font-size: 0.95rem; }

  .pick-levels { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 0.75rem; font-size: 0.82rem; margin-bottom: 0.6rem; }
  .pick-levels .lbl { color: #8b949e; }
  .pick-levels .val { font-weight: 600; }
  .pick-levels .val.green { color: #3fb950; }
  .pick-levels .val.red { color: #f85149; }

  .pick-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .pick-tag {
    font-size: 0.7rem; padding: 0.15rem 0.45rem; border-radius: 4px; font-weight: 600;
    border: 1px solid;
  }
  .tag-buy-zone { background: #3fb95015; color: #3fb950; border-color: #3fb95040; }
  .tag-win-rate { background: #58a6ff15; color: #58a6ff; border-color: #58a6ff40; }
  .tag-confluence { background: #d4940015; color: #d49400; border-color: #d4940040; }
  .tag-vol-confirmed { background: #3fb95015; color: #3fb950; border-color: #3fb95040; }
  .tag-vol-low { background: #f0883e15; color: #f0883e; border-color: #f0883e40; }
  .tag-warning { background: #d2992215; color: #d29922; border-color: #d2992240; }

  .empty-state { text-align: center; padding: 3rem; color: #8b949e; }
  .empty-state p { font-size: 1.05rem; margin-bottom: 0.5rem; }

  @media (max-width: 720px) {
    .picks-grid { grid-template-columns: 1fr; }
    .tab-bar { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;gap:1rem;margin-bottom:1rem;font-size:0.85rem;">
    <a href="/" style="color:#8b949e;">&larr; Analysis</a>
    <a href="/patterns">Chart Patterns</a>
  </div>
  <div class="header">
    <h1>Top Picks <span>Scanner</span></h1>
    <div class="sub">NSE 500 + BSE stocks with &gt;75% backtest accuracy, ranked by buy conviction</div>
  </div>

  <div class="tab-bar">
    <button class="tab-intra" onclick="loadPicks('intraday')">Intraday</button>
    <button class="tab-short" onclick="loadPicks('short_term')">Short Term</button>
    <button class="tab-pos active" onclick="loadPicks('positional')">Positional</button>
  </div>

  <div class="meta-bar" id="metaBar" style="display:none;">
    <span id="metaTimestamp"></span>
    <span id="metaCount"></span>
  </div>

  <div class="spinner" id="spinner">Loading picks&hellip;</div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="picks-grid" id="picksGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <p>No qualifying buy picks for this timeframe.</p>
    <span style="font-size:0.85rem;">NSE 500 + BSE stocks must have &gt;75% backtest win rate and a buy conviction &ge; 55 or be in a BUY ZONE.</span>
  </div>
</div>

<script>
const cache = {};
let currentTf = 'positional';

function fmt(v) { return v != null ? Number(v).toLocaleString('en-IN', {maximumFractionDigits: 2}) : '—'; }

function setTab(tf) {
  currentTf = tf;
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  const cls = tf === 'intraday' ? 'tab-intra' : tf === 'short_term' ? 'tab-short' : 'tab-pos';
  document.querySelector(`.${cls}`).classList.add('active');
}

async function loadPicks(tf) {
  setTab(tf);
  const grid = document.getElementById('picksGrid');
  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('errorMsg');
  const metaBar = document.getElementById('metaBar');
  const emptyState = document.getElementById('emptyState');

  grid.innerHTML = '';
  errorMsg.style.display = 'none';
  emptyState.style.display = 'none';
  metaBar.style.display = 'none';

  if (cache[tf]) { renderPicks(cache[tf]); return; }

  spinner.classList.add('active');

  try {
    const res = await fetch(`/scanner/picks?timeframe=${tf}`);
    const data = await res.json();
    if (data.error) { errorMsg.textContent = data.error; errorMsg.style.display = 'block'; return; }
    cache[tf] = data;
    renderPicks(data);
  } catch (err) {
    errorMsg.textContent = 'Network error: ' + err.message;
    errorMsg.style.display = 'block';
  } finally {
    spinner.classList.remove('active');
  }
}

function renderPicks(data) {
  const grid = document.getElementById('picksGrid');
  const metaBar = document.getElementById('metaBar');
  const emptyState = document.getElementById('emptyState');

  if (data.timestamp) {
    try {
      const d = new Date(data.timestamp);
      document.getElementById('metaTimestamp').textContent = 'Last scanned: ' + d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) + ' ' + d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
    } catch { document.getElementById('metaTimestamp').textContent = 'Last scanned: ' + data.timestamp; }
    document.getElementById('metaCount').textContent = `${data.picks.length} picks from ${data.qualifying_count} qualifying stocks`;
    metaBar.style.display = 'flex';
  }

  if (!data.picks || data.picks.length === 0) {
    emptyState.style.display = 'block';
    return;
  }

  grid.innerHTML = data.picks.map(p => {
    const cv = p.conviction || {};
    const cvScore = cv.score || 0;
    const cvColor = cvScore >= 70 ? '#3fb950' : cvScore >= 55 ? '#a3d977' : cvScore >= 45 ? '#8b949e' : cvScore >= 30 ? '#f0883e' : '#f85149';
    const cvBg = cvColor + '18';
    const cvBorder = cvColor + '50';

    let tags = '';
    if (p.entry_confirmed) tags += '<span class="pick-tag" style="background:#3fb95020;color:#3fb950;border-color:#3fb95050;font-weight:700;">CONFIRMED</span>';
    if (p.status === 'BUY ZONE') tags += '<span class="pick-tag tag-buy-zone">BUY ZONE</span>';
    if (p.patterns && p.patterns.length) p.patterns.forEach(pat => { tags += `<span class="pick-tag" style="background:#8b5cf615;color:#a78bfa;border-color:#8b5cf640;">${pat}</span>`; });
    if (p.ema_crossovers && p.ema_crossovers.length) p.ema_crossovers.forEach(c => { tags += `<span class="pick-tag" style="background:#3fb95015;color:#3fb950;border-color:#3fb95040;">${c}</span>`; });
    if (p.confluence_count > 1) tags += `<span class="pick-tag tag-confluence">${p.confluence_count}-way confluence</span>`;
    if (p.volume_environment === 'confirmed') tags += '<span class="pick-tag tag-vol-confirmed">Vol Confirmed</span>';
    else if (p.volume_environment === 'low') tags += '<span class="pick-tag tag-vol-low">Low Vol</span>';
    if (p.trend_warning) tags += '<span class="pick-tag tag-warning">Counter-trend</span>';

    const t1 = p.targets && p.targets[0] ? fmt(p.targets[0]) : '—';
    const t2 = p.targets && p.targets[1] ? fmt(p.targets[1]) : '—';
    const sym = (p.symbol || '').replace('NSE:', '').replace('-EQ', '');
    const rsColor = (p.relative_strength || 0) > 0 ? '#3fb950' : (p.relative_strength || 0) < 0 ? '#f85149' : '#8b949e';
    const emaColor = p.ema_alignment === 'strong_bullish' ? '#3fb950' : p.ema_alignment === 'bullish' ? '#a3d977' : p.ema_alignment === 'bearish' ? '#f0883e' : p.ema_alignment === 'strong_bearish' ? '#f85149' : '#8b949e';

    const verdictColor = p.verdict === 'BUY' ? '#3fb950' : p.verdict === 'SELL' ? '#f85149' : '#8b949e';
    const verdictBorder = p.verdict === 'BUY' ? '#3fb95060' : p.verdict === 'SELL' ? '#f8514960' : '#30363d';

    return `<div class="pick-card" style="border-color:${verdictBorder};">
      <div class="pick-header">
        <div>
          <div class="pick-symbol"><a href="/?symbol=${encodeURIComponent(sym)}">${sym}</a> <span style="font-size:0.8rem;font-weight:800;color:${verdictColor};margin-left:0.3rem;">${p.verdict || ''}</span></div>
          <div class="pick-name">${p.name || ''}</div>
        </div>
        <div style="text-align:right;">
          <div class="pick-conviction" style="background:${cvBg};color:${cvColor};border:1px solid ${cvBorder};">
            ${cvScore} ${cv.label || ''}
          </div>
          <div style="font-size:0.7rem;color:#8b949e;margin-top:0.25rem;">Rank: ${p.rank_score || '—'}</div>
        </div>
      </div>
      <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;margin-bottom:0.5rem;font-size:0.8rem;">
        <span>CMP: <strong style="color:#e1e4e8;">₹${fmt(p.cmp)}</strong></span>
        <span>RS: <strong style="color:${rsColor};">${p.relative_strength != null ? (p.relative_strength > 0 ? '+' : '') + p.relative_strength.toFixed(1) + '%' : '—'}</strong></span>
        <span>EMA: <strong style="color:${emaColor};">${(p.ema_alignment || 'neutral').replace('_', ' ')}</strong></span>
        <span>PF: <strong>${p.profit_factor || '—'}</strong></span>
        <span>Win: <strong>${p.win_rate ? fmt(p.win_rate) + '%' : '—'}</strong></span>
      </div>
      ${p.verdict_reasons && p.verdict_reasons.length ? `<div style="margin-bottom:0.4rem;">${p.verdict_reasons.map(r => `<div style="font-size:0.75rem;color:#c9d1d9;padding:0.1rem 0;"><span style="color:${verdictColor};margin-right:0.3rem;">&#10003;</span>${r}</div>`).join('')}</div>` : ''}
      <div class="pick-levels">
        <span class="lbl">Buy @</span><span class="val green">₹${fmt(p.buy_level)} <span style="font-size:0.75rem;color:#8b949e;">(${p.buy_distance_pct != null ? p.buy_distance_pct.toFixed(1) + '%' : '—'})</span></span>
        <span class="lbl">SL</span><span class="val red">₹${fmt(p.sl)}</span>
        <span class="lbl">Target 1</span><span class="val">₹${t1}</span>
        <span class="lbl">Target 2</span><span class="val">₹${t2}</span>
        <span class="lbl">R:R</span><span class="val">${p.rr != null ? '1 : ' + p.rr.toFixed(1) : '—'}</span>
        <span class="lbl">Qty / Capital</span><span class="val">${p.suggested_qty || '—'} shares / ₹${p.capital_required ? fmt(p.capital_required) : '—'}</span>
      </div>
      <div class="pick-tags">${tags}</div>
    </div>`;
  }).join('');
}

loadPicks('positional');
</script>
</body>
</html>
